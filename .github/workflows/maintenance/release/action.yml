name: release
description: Create a GitHub release after the four DEB package builds complete.
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      shell: bash
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.tag }}"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        else
          TAG="v$(node -p "require('./package.json').version")"
        fi
        echo "prerelease=false" >> "$GITHUB_OUTPUT"
        echo "version=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Version: ${TAG}"

    - name: Create and push tag if needed
      shell: bash
      run: |
        TAG="${{ steps.version.outputs.version }}"
        if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
          echo "Tag ${TAG} already exists on remote, skipping creation"
        else
          echo "Creating tag ${TAG}..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Tag ${TAG} created and pushed"
        fi

    - name: Download DEB Debian 12 artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.run_id }}
        name: deb-package-debian12
        path: artifacts/deb-debian12
        if_no_artifact_found: fail

    - name: Download DEB Debian 13 artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.run_id }}
        name: deb-package-debian13
        path: artifacts/deb-debian13
        if_no_artifact_found: fail

    - name: Download DEB Ubuntu 24.04 artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.run_id }}
        name: deb-package-ubuntu2404
        path: artifacts/deb-ubuntu2404
        if_no_artifact_found: fail

    - name: Download DEB Ubuntu 26.04 artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.run_id }}
        name: deb-package-ubuntu2604
        path: artifacts/deb-ubuntu2604
        if_no_artifact_found: fail

    - name: Prepare release files
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        mkdir -p release
        find artifacts/ -type f -name "*.deb" -print0 | while IFS= read -r -d '' src; do
          name="$(basename "$src")"
          case "$name" in
            proton-drive*_${VERSION}_*)
              ;;
            *)
              echo "Skipping stale artifact: $name"
              continue
              ;;
          esac
          cp "$src" "release/${name}"
        done
        cd release
        sha256sum *.deb > SHA256SUMS
        echo "Release artifacts:"
        ls -lah
        cd ..

    - name: Create release notes
      shell: bash
      run: |
        RELEASE_DATE=$(date -u +'%Y-%m-%d')
        VERSION=${{ steps.version.outputs.version }}

        {
          echo "# Proton Drive Linux ${VERSION}"
          echo ""
          echo "**Release Date:** ${RELEASE_DATE}"
          echo ""
          echo "An unofficial Linux desktop client for Proton Drive, built with Tauri."
          echo ""
          echo "## Downloads"
          echo ""
          echo "| Format | File | Description |"
          echo "|--------|------|-------------|"
          echo "| DEB (Debian 12) | \`proton-drive_*_debian12_amd64.deb\` | Debian 12 (Bookworm) |"
          echo "| DEB (Debian 13) | \`proton-drive_*_debian13_amd64.deb\` | Debian 13 (Trixie) |"
          echo "| DEB (Ubuntu 24.04) | \`proton-drive_*_ubuntu24.04_amd64.deb\` | Ubuntu 24.04 LTS (Noble) |"
          echo "| DEB (Ubuntu 26.04) | \`proton-drive_*_ubuntu26.04_amd64.deb\` | Ubuntu 26.04 LTS |"
          echo ""
          echo "## Installation"
          echo ""
          echo "\`\`\`bash"
          echo "sudo apt install ./proton-drive_*.deb"
          echo "\`\`\`"
          echo ""
          echo "## System Requirements"
          echo ""
          echo "- Linux x86_64 (Debian/Ubuntu)"
          echo "- GTK 3.0+ and WebKitGTK 4.1"
          echo "- ~200MB disk space"
          echo ""
          echo "## Checksums"
          echo ""
          echo "All files have SHA256 checksums available in \`SHA256SUMS\`."
          echo ""
          echo "## Issues"
          echo ""
          echo "Report issues at https://github.com/${{ github.repository }}/issues"
        } > RELEASE_NOTES.md

    - name: Delete stale release assets
      shell: bash
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        TAG="${{ steps.version.outputs.version }}"
        EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
        if [ -n "$EXISTING" ]; then
          echo "Cleaning existing assets before upload..."
          echo "$EXISTING" | while read -r name; do
            [ -z "$name" ] && continue
            echo "  Deleting $name"
            gh release delete-asset "$TAG" "$name" --yes || true
          done
        fi
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: release/*
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
