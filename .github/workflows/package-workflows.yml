name: Package Workflows

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow implementation to run, or all
        required: false
        default: all
      distro_patch:
        description: Optional distro patch override
        required: false
      tag:
        description: Release tag, for release workflow
        required: false
      version:
        description: Version to publish
        required: false

  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_deb_debian_12:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'build-deb-debian-12'))
    name: Debian 12 DEB
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    env:
      RUST_VERSION: stable
      DISTRO_TYPE: deb
      DISTRO_PATCH: ${{ github.event.inputs.distro_patch || 'debian.12' }}
      DISTRO_SUFFIX: debian12
      WEBCLIENTS_REF: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/deb/debian-12

  build_deb_debian_13:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'build-deb-debian-13'))
    name: Debian 13 DEB
    runs-on: ubuntu-latest
    container:
      image: debian:13
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    env:
      RUST_VERSION: stable
      DISTRO_TYPE: deb
      DISTRO_SUFFIX: debian13
      WEBCLIENTS_REF: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/deb/debian-13

  build_deb_ubuntu_24_04:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'build-deb-ubuntu-24-04'))
    name: Ubuntu 24.04 DEB
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    env:
      RUST_VERSION: stable
      DISTRO_TYPE: deb
      DISTRO_SUFFIX: ubuntu24.04
      WEBCLIENTS_REF: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/deb/ubuntu-24.04

  build_deb_ubuntu_26_04:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'build-deb-ubuntu-26-04'))
    name: Ubuntu 26.04 DEB
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    env:
      RUST_VERSION: stable
      DISTRO_TYPE: deb
      DISTRO_SUFFIX: ubuntu26.04
      WEBCLIENTS_REF: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/deb/ubuntu-26.04

  generate_package_specs_create_source_dist:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'generate-package-specs-create-source-dist'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/maintenance/generate-package-specs/source-dist

  issue_auto_label:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'issue-auto-label'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/maintenance/issue-auto-label

  pr_auto_label:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.workflow == 'all' || inputs.workflow == 'pr-auto-label'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/maintenance/pr-auto-label

  release:
    needs:
      - build_deb_debian_12
      - build_deb_debian_13
      - build_deb_ubuntu_24_04
      - build_deb_ubuntu_26_04
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.workflow == 'all' || inputs.workflow == 'release') &&
      needs.build_deb_debian_12.result != 'failure' &&
      needs.build_deb_debian_13.result != 'failure' &&
      needs.build_deb_ubuntu_24_04.result != 'failure' &&
      needs.build_deb_ubuntu_26_04.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow implementation
        uses: ./.github/workflows/maintenance/release
