compatibility_gates:
  glibc:
    minimum: "2.35"
    description: "Minimum glibc for compiled Rust/Tauri binary to link and run"
  webkitgtk:
    minimum: "4.1"
    description: "WebKitGTK 4.1 with GTK 3 must be available in target repos or runtime"

webkitgtk_runtime:
  deb: libwebkit2gtk-4.1-0
  build_deb: libwebkit2gtk-4.1-dev

ci_workflows:
  entrypoint: .github/workflows/package-workflows.yml
  generate_package_specs: .github/workflows/maintenance/generate-package-specs
  release: .github/workflows/maintenance/release

deb:
  debian12:
    status: release-gated
    gates:
      glibc: pass
      webkitgtk: pass
    runtime_smoke:
      status: pass
      evidence: remote artifact pass
    workflow: .github/workflows/deb/debian-12
    build_container: debian:12
    release_label: debian12
    artifact_name: deb-package-debian12
    patch: debian.12
    supports:
      - debian-12
  debian13:
    status: release-gated
    gates:
      glibc: pass
      webkitgtk: pass
    runtime_smoke:
      status: pass
      evidence: remote artifact install and launch on Debian 13 host
    workflow: .github/workflows/deb/debian-13
    build_container: debian:13
    release_label: debian13
    artifact_name: deb-package-debian13
    patch: debian.13
    supports:
      - debian-13
  ubuntu24.04:
    status: release-gated
    gates:
      glibc: pass
      webkitgtk: pass
    runtime_smoke:
      status: pass
      evidence: remote artifact pass
    workflow: .github/workflows/deb/ubuntu-24.04
    build_container: ubuntu:24.04
    release_label: ubuntu24.04
    artifact_name: deb-package-ubuntu2404
    patch: ubuntu.24.04
    supports:
      - ubuntu-24.04
      - linuxmint-22
      - ubuntu-24.04-derivatives
  ubuntu26.04:
    status: release-gated
    gates:
      glibc: pass
      webkitgtk: pass
    runtime_smoke:
      status: pass
      evidence: remote artifact pass
    workflow: .github/workflows/deb/ubuntu-26.04
    build_container: ubuntu:26.04
    release_label: ubuntu26.04
    artifact_name: deb-package-ubuntu2604
    patch: ubuntu.26.04
    supports:
      - ubuntu-26.04
      - ubuntu-26.04-derivatives

legacy_candidates:
  deb:
    ubuntu22.04:
      status: verify-first
      gates:
        glibc: pass
        webkitgtk: unverified
      reason: "glibc 2.35 passes; WebKitGTK 4.1 availability in Jammy repos or backports must be verified before adding a DEB target."

not_primary:
  deb:
    ubuntu20.04:
      status: not-primary
      gates:
        glibc: fail
        webkitgtk: fail
      reason: "Both gates fail. glibc 2.31 is below the 2.35 minimum and WebKitGTK 4.1 is not available."
    debian11:
      status: not-primary
      gates:
        glibc: fail
        webkitgtk: fail
      reason: "Both gates fail. glibc 2.31 is below the 2.35 minimum and WebKitGTK 4.1 is not available."

architectures:
  release_gate:
    - x86_64
  planned:
    - aarch64
  legacy:
    - armv7
    - x86
  experimental:
    - riscv64

architecture_details:
  x86_64:
    status: release-gated
    notes: "current artifact architecture"
  aarch64:
    status: roadmap
    notes: "next practical architecture for DEB"
  armv7:
    status: legacy
    notes: "32-bit ARM including RPi 2/3; WebKitGTK 4.1 cross-compilation and runtime on armv7 must be verified before any workflow is added"
  x86:
    status: legacy
    notes: "32-bit x86; no native packages planned"
  riscv64:
    status: experimental
    notes: "requires separate build/test work"
